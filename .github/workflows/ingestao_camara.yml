name: Ingestão Câmara

on:
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos separados por vírgula (vazio = anos_padrao do config)"
        required: false
        default: ""
  schedule:
    - cron: "17 9 * * 1"   # segundas, 06:17 em Brasília

permissions:
  contents: write

concurrency:
  group: ingestao-camara
  cancel-in-progress: false

jobs:
  ingestao:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.txt

      - name: Instalar dependências
        run: pip install -r requirements-ingest.txt

      - name: Testes
        run: python -m pytest -q tests

      - name: Baixar pacotes de dados do Release
        run: python -m src.storage baixar || echo "Sem pacotes ainda; ingestão completa."

      - name: Baixar e converter
        env:
          ANOS: ${{ github.event.inputs.anos }}
        run: python -m src.ingestion.camara

      - name: Histórico de mandatos (API)
        run: python -m src.ingestion.camara_api

      - name: Relatório de qualidade
        if: always()
        run: python -m src.processing.validation

      - name: Camada processada
        run: python -m src.processing.entities

      - name: Rede de votação
        run: python -m src.networks.votacao

      - name: Fatias por tema e tempo
        run: python -m src.networks.fatias

      - name: Indicadores de governabilidade
        run: python -m src.governance.indicadores

      - name: Comparação entre legislaturas
        run: python -m src.networks.comparacao

      - name: Dimensões de voto
        run: python -m src.networks.dimensoes

      - name: Dinâmica mensal (agenda, polarização, folga)
        run: python -m src.governance.dinamica

      - name: Pontos de mudança e comunidades no tempo
        run: python -m src.networks.mudancas

      - name: Rede em várias camadas (frentes e coautoria)
        run: python -m src.networks.multicamadas

      - name: Modelo de voto individual
        run: python -m src.models.voto_individual

      - name: Deputados acompanhados
        run: python -m src.governance.acompanhamento

      - name: Publicar resumo
        if: always()
        run: |
          cat artifacts/reports/qualidade_camara.md >> "$GITHUB_STEP_SUMMARY" || true
          cat artifacts/reports/processed_camara.md >> "$GITHUB_STEP_SUMMARY" || true
          for f in artifacts/reports/leg*/*.md artifacts/reports/comparacao.md artifacts/reports/acompanhamento.md; do
            [ -f "$f" ] && { echo "## $f"; cat "$f"; } >> "$GITHUB_STEP_SUMMARY"
          done || true

      - name: Publicar pacotes de dados no Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m src.storage publicar

      - name: Commit dos resultados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/marts data/metadata artifacts/reports
          # só commita se algum dado mudou (o log de execução sozinho não conta)
          if git diff --cached --name-only | grep -v '_ultima_execucao.json' | grep -q .; then
            git commit -m "dados: ingestão Câmara $(date -u +%F)"
            # o main pode ter avançado durante a execução (commit de código): integra antes de enviar
            git pull --rebase -q origin main
            git push
          else
            echo "Nenhum dado novo."
          fi

      - name: Gerar página (site/)
        continue-on-error: true
        run: python -m src.site.gerar

      - name: Empacotar página para o GitHub Pages
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pagina:
    needs: ingestao
    runs-on: ubuntu-latest
    # Requer GitHub Pages ativado com fonte "GitHub Actions" (Settings → Pages).
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

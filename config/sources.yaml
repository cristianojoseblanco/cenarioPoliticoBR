# Todos os parâmetros de ingestão ficam aqui. Nenhuma constante no código.

camara:
  base_url: "https://dadosabertos.camara.leg.br/arquivos"
  formato: "csv"
  csv_delim: ";"

  # Anos ingeridos por padrão (legislaturas 56 e 57: 2019–2027).
  # Pode ser sobrescrito pela variável de ambiente ANOS (ex.: "2023,2024").
  anos_padrao: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
  # Anos mais antigos que (ano atual − N) não são baixados de novo se já existem:
  # a fonte quase não muda e isso poupa tempo de execução.
  recarregar_anos_recentes: 2

  # Arquivos separados por ano: {base_url}/{nome}/{formato}/{nome}-{ano}.{formato}
  datasets_anuais:
    - votacoes
    - votacoesVotos
    - votacoesOrientacoes
    - votacoesProposicoes

  # Arquivos organizados pelo ano de APRESENTAÇÃO da proposição. Os anos são
  # derivados dos dados: todo ano de apresentação de proposição que teve
  # votação nominal nos anos ingeridos (votacoesProposicoes.proposicao_ano),
  # mais os próprios anos ingeridos.
  datasets_por_apresentacao:
    - proposicoes
    - proposicoesTemas
    - proposicoesAutores
  ano_minimo_apresentacao: 1946

  # Arquivos únicos: {base_url}/{nome}/{formato}/{nome}.{formato}
  datasets_unicos:
    - deputados

  # API REST (dados que não existem em arquivo em lote)
  api_base: "https://dadosabertos.camara.leg.br/api/v2"
  api_pausa_s: 0.15
  # Legislaturas cujos deputados terão o histórico de mandato baixado
  # (somados aos deputados que aparecem nos votos ingeridos).
  legislaturas_historico: [56, 57]

  # Colunas-chave esperadas, conferidas no relatório de qualidade.
  # Se a Câmara mudar o esquema, o relatório acusa; o código não quebra.
  chaves:
    votacoes: [id]
    votacoesVotos: [idVotacao, deputado_id]
    votacoesOrientacoes: [idVotacao, siglaBancada]
    votacoesProposicoes: [idVotacao, proposicao_id]
    deputados: [uri]

http:
  timeout_s: 300
  retries: 4
  user_agent: "cenarioPoliticoBR/0.1 (pesquisa acadêmica; github.com/cristianojoseblanco/cenarioPoliticoBR)"

caminhos:
  staging: "data/staging/camara"
  metadata: "data/metadata/camara"
  tmp: "data/raw/_tmp"
  relatorio_qualidade: "artifacts/reports/qualidade_camara.md"
  processed: "data/processed/camara"
  relatorio_processed: "artifacts/reports/processed_camara.md"

processamento:
  # Tipos de proposição sem tema próprio herdam o tema da proposição principal
  # (ex.: requerimento de urgência herda o tema do PL a que se refere).
  herdar_tema_da_principal: true
  # Colunas de staging que não passam para a camada processada
  # (dado pessoal sem uso analítico).
  colunas_excluidas:
    deputados: [cpf]
  # Histórico de mandato (API): cada evento traz a situação do deputado depois dele.
  # Em exercício enquanto a última situação conhecida estiver nesta lista.
  situacoes_exercicio: ["Exercício"]
  # Eventos cuja descrição contém um destes marcadores abrem um período mesmo quando a situação
  # registrada é outra (ex.: "Entrada - Reassunção / DIVERSO - Convocação..." com situação CONVOCADO).
  marcadores_entrada: ["Entrada - "]
  # Fim de um período ainda aberto (mandato em curso).
  fim_periodo_aberto: "2100-01-01"

duckdb:
  memory_limit: "4GB"
  threads: 4

# Etapa 3 — rede de votação. Decisões registradas no vault:
# Método/Codificação dos votos.md e Método/Registro de decisões.md
redes:
  saida: "data/marts/camara/redes"
  relatorio: "artifacts/reports/rede_votacao.md"
  orgaos: [PLEN]
  periodo: {inicio: null, fim: null}   # null = tudo o que existe nos dados

  # Valor de cada registro de voto. Registro fora do mapa = sem valor (célula vazia).
  codificacoes:
    A: {"Sim": 1, "Não": -1, "Obstrução": -1}
    B: {"Sim": 1, "Não": -1}
    C: {"Sim": 1, "Não": -1, "Obstrução": -1, "Abstenção": 0}

  # Votação entra se a minoria (entre os votos com valor ±1) for >= este limiar.
  # Votação sem nenhum voto com valor (secreta) sai automaticamente.
  minoria_minima: 0.025

  # Par de deputados só é comparado com pelo menos esse número de votações em comum.
  min_votos_comuns: 50

  # Grafo: cada deputado liga-se aos k mais parecidos (kNN simétrico), peso = concordância.
  knn: 15

  leiden:
    resolucao: 1.0
    sementes: 20        # roda com várias sementes e fica com a de maior qualidade

  # Variações para a análise de sensibilidade (cada uma muda um parâmetro).
  sensibilidade:
    codificacao: [B, C]
    minoria_minima: [0.0, 0.10]
    knn: [10, 25]

  principal:
    codificacao: A

# Etapa 4 — fatias por tema e por tempo. Decisões no vault: Método/Registro de decisões.md
fatias:
  saida: "data/marts/camara/fatias"
  relatorio: "artifacts/reports/fatias.md"
  # Temas oficiais da Câmara, sem agrupamento próprio (decisão revisável).
  # Entram os temas com pelo menos este número de votações incluídas.
  tema_min_votacoes: 75
  # Janelas móveis de N votações seguidas (ordem cronológica), avançando de P em P.
  janela_votacoes: 150
  janela_passo: 50
  # Votações em comum por par dentro da fatia: max(piso, fração × votações da fatia).
  min_comuns_fracao: 0.40
  min_comuns_piso: 30
  # Eixo de referência: os dois polos são as duas comunidades globais com MENOR
  # concordância entre si (escolhidas pelos dados, sem rótulo ideológico).
  # Núcleo de um polo = deputados que ficam na mesma comunidade em todas as variantes
  # de sensibilidade da Etapa 3.
  # Só comunidades com núcleo estável de pelo menos este tamanho podem ser polo.
  nucleo_minimo: 20
  # "Quem mais se moveu": compara a posição média nas primeiras e nas últimas N janelas.
  janelas_comparacao: 3

# Etapa 5 — indicadores de governabilidade. Decisões no vault: Método/Registro de decisões.md
governabilidade:
  saida: "data/marts/camara/governabilidade"
  relatorio: "artifacts/reports/governabilidade.md"
  orgaos: [PLEN]
  # Nome da bancada do líder do Governo (mudou de grafia entre legislaturas).
  bancada_governo: ["Governo", "GOV."]
  # Orientações que contam como posição (mesma lógica da codificação A).
  # "Liberado" e vazio ficam fora das medidas de apoio e disciplina.
  valores_orientacao: {"Sim": 1, "Não": -1, "Obstrução": -1}
  # Padronização de nomes de bancada (grafias e nomes cortados -> sigla do partido).
  # Vale para bancadas de partido e para membros de federação ("Fdr A-B-C").
  apelidos_bancada:
    "Novo": "NOVO"
    "Solidaried": "SOLIDARIEDADE"
    "Republican": "REPUBLICANOS"
    "União": "UNIÃO"
    "Avante": "AVANTE"
    "Podemos": "PODE"
    "Missão": "MISSÃO"
    "Patriota": "PATRIOTA"
    "CIDADAN": "CIDADANIA"
  prefixo_federacao: "Fdr "
  # Bancadas que não são partido (não servem para disciplina).
  bancadas_nao_partidarias: ["Governo", "GOV.", "Maioria", "Minoria", "Oposição", "Bloco Parlamentar"]
  # Blocos: terceiro nível (depois de partido e federação). O nome é decifrado pelas
  # abreviações abaixo; só os membros visíveis antes de "..." entram.
  blocos:
    usar: true
    prefixo: "Bl "
    abreviacoes:
      "Uni": "UNIÃO"
      "Pp": "PP"
      "Psd": "PSD"
      "Mdb": "MDB"
      "Rep": "REPUBLICANOS"
      "Pode": "PODE"
      "Psc": "PSC"
      "Avan": "AVANTE"
      "Solid": "SOLIDARIEDADE"
      "Prd": "PRD"
      "Pl": "PL"
      "FdrPsdbCid": ["PSDB", "CIDADANIA"]
      "FdrPt": ["PT", "PCdoB", "PV"]
      "FdrPT": ["PT", "PCdoB", "PV"]
  # Disciplina medida em menos desta fração dos votos do partido aparece com aviso.
  disciplina_cobertura_minima: 0.30
  # Coesão (índice de Rice) só quando o partido tem pelo menos N votos com valor na votação.
  rice_min_votos: 5
  # Votação com proposição destes tipos exige quórum qualificado: placar Sim > Não não basta.
  tipos_quorum_qualificado: [PEC, PLP]
  # Participação: "aproximacao" (em exercício = votou no Plenário no mesmo mês)
  # ou "historico" (períodos de exercício pela API da Câmara).
  participacao_fonte: "historico"

# Armazenamento. Camadas grandes (staging, processed) NÃO ficam no Git: vão como pacotes
# num Release fixo do GitHub, substituídos a cada execução (sem histórico acumulado).
# No Git ficam só código, config, metadados, relatórios e marts (resultados pequenos).
armazenamento:
  repositorio: "cristianojoseblanco/cenarioPoliticoBR"
  release_tag: "dados"
  pacotes:
    staging_camara: "data/staging/camara"
    processed_camara: "data/processed/camara"

# Análises por legislatura (Etapa 7a). Cada uma roda com os MESMOS parâmetros de `redes`,
# `fatias` e `governabilidade`; resultados em data/marts/camara/leg<N>/.
legislaturas:
  "56": {inicio: "2019-02-01", fim: "2023-01-31"}
  "57": {inicio: "2023-02-01", fim: "2027-01-31"}
# Períodos marcados nos gráficos e notas (não excluem dados).
marcadores_periodo:
  - inicio: "2020-03-17"
    fim: "2021-10-21"
    rotulo: "votação remota (aprox.)"
    fonte: "Resolução da Câmara 14/2020; Ato da Mesa 208/2021"

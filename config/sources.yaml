# Todos os parâmetros de ingestão ficam aqui. Nenhuma constante no código.

camara:
  base_url: "https://dadosabertos.camara.leg.br/arquivos"
  formato: "csv"
  csv_delim: ";"

  # Anos ingeridos por padrão: de `desde` até o ano corrente (legislaturas 56 em diante).
  # Pode ser sobrescrito pela variável de ambiente ANOS (ex.: "2023,2024").
  anos_padrao: {desde: 2019}
  # Anos mais antigos que (ano atual − N) não são baixados de novo se já existem:
  # a fonte quase não muda e isso poupa tempo de execução.
  recarregar_anos_recentes: 2

  # Arquivos separados por ano: {base_url}/{nome}/{formato}/{nome}-{ano}.{formato}
  datasets_anuais:
    - votacoes
    - votacoesVotos
    - votacoesOrientacoes
    - votacoesProposicoes

  # Arquivos organizados pelo ano de APRESENTAÇÃO da proposição. Os anos são
  # derivados dos dados: todo ano de apresentação de proposição que teve
  # votação nominal nos anos ingeridos (votacoesProposicoes.proposicao_ano),
  # mais os próprios anos ingeridos.
  datasets_por_apresentacao:
    - proposicoes
    - proposicoesTemas
    - proposicoesAutores
  ano_minimo_apresentacao: 1946

  # Arquivos únicos: {base_url}/{nome}/{formato}/{nome}.{formato}
  datasets_unicos:
    - deputados
    - frentes            # frentes parlamentares (todas as legislaturas)
    - frentesDeputados   # membros de cada frente

  # API REST (dados que não existem em arquivo em lote)
  api_base: "https://dadosabertos.camara.leg.br/api/v2"
  api_pausa_s: 0.15
  # Legislaturas cujos deputados terão o histórico de mandato baixado
  # (somados aos deputados que aparecem nos votos ingeridos).
  legislaturas_historico: [56, 57, 58]

  # Colunas-chave esperadas, conferidas no relatório de qualidade.
  # Se a Câmara mudar o esquema, o relatório acusa; o código não quebra.
  chaves:
    votacoes: [id]
    votacoesVotos: [idVotacao, deputado_id]
    votacoesOrientacoes: [idVotacao, siglaBancada]
    votacoesProposicoes: [idVotacao, proposicao_id]
    deputados: [uri]

http:
  timeout_s: 300
  retries: 4
  user_agent: "cenarioPoliticoBR/0.1 (pesquisa acadêmica; github.com/cristianojoseblanco/cenarioPoliticoBR)"

caminhos:
  staging: "data/staging/camara"
  metadata: "data/metadata/camara"
  tmp: "data/raw/_tmp"
  relatorio_qualidade: "artifacts/reports/qualidade_camara.md"
  processed: "data/processed/camara"
  relatorio_processed: "artifacts/reports/processed_camara.md"

processamento:
  # Tipos de proposição sem tema próprio herdam o tema da proposição principal
  # (ex.: requerimento de urgência herda o tema do PL a que se refere).
  herdar_tema_da_principal: true
  # Colunas de staging que não passam para a camada processada
  # (dado pessoal sem uso analítico).
  colunas_excluidas:
    deputados: [cpf]
  # Histórico de mandato (API): cada evento traz a situação do deputado depois dele.
  # Em exercício enquanto a última situação conhecida estiver nesta lista.
  situacoes_exercicio: ["Exercício"]
  # Eventos cuja descrição contém um destes marcadores abrem um período mesmo quando a situação
  # registrada é outra (ex.: "Entrada - Reassunção / DIVERSO - Convocação..." com situação CONVOCADO).
  marcadores_entrada: ["Entrada - "]
  # Fim de um período ainda aberto (mandato em curso).
  fim_periodo_aberto: "2100-01-01"

duckdb:
  memory_limit: "4GB"
  threads: 4

# Etapa 3 — rede de votação. Decisões registradas no vault:
# Método/Codificação dos votos.md e Método/Registro de decisões.md
redes:
  saida: "data/marts/camara/redes"
  relatorio: "artifacts/reports/rede_votacao.md"
  orgaos: [PLEN]
  periodo: {inicio: null, fim: null}   # null = tudo o que existe nos dados

  # Valor de cada registro de voto. Registro fora do mapa = sem valor (célula vazia).
  codificacoes:
    A: {"Sim": 1, "Não": -1, "Obstrução": -1}
    B: {"Sim": 1, "Não": -1}
    C: {"Sim": 1, "Não": -1, "Obstrução": -1, "Abstenção": 0}

  # Votação entra se a minoria (entre os votos com valor ±1) for >= este limiar.
  # Votação sem nenhum voto com valor (secreta) sai automaticamente.
  minoria_minima: 0.025

  # Par de deputados só é comparado com pelo menos esse número de votações em comum.
  min_votos_comuns: 50

  # Grafo: cada deputado liga-se aos k mais parecidos (kNN simétrico), peso = concordância.
  knn: 15

  leiden:
    resolucao: 1.0
    sementes: 20        # roda com várias sementes e fica com a de maior qualidade

  # Variações para a análise de sensibilidade (cada uma muda um parâmetro).
  sensibilidade:
    codificacao: [B, C]
    minoria_minima: [0.0, 0.10]
    knn: [10, 25]

  principal:
    codificacao: A

# Etapa 4 — fatias por tema e por tempo. Decisões no vault: Método/Registro de decisões.md
fatias:
  saida: "data/marts/camara/fatias"
  relatorio: "artifacts/reports/fatias.md"
  # Temas oficiais da Câmara, sem agrupamento próprio (decisão revisável).
  # Entram os temas com pelo menos este número de votações incluídas.
  tema_min_votacoes: 75
  # Janelas móveis de N votações seguidas (ordem cronológica), avançando de P em P.
  janela_votacoes: 150
  janela_passo: 50
  # Votações em comum por par dentro da fatia: max(piso, fração × votações da fatia).
  min_comuns_fracao: 0.40
  min_comuns_piso: 30
  # Eixo de referência: os dois polos são as duas comunidades globais com MENOR
  # concordância entre si (escolhidas pelos dados, sem rótulo ideológico).
  # Núcleo de um polo = deputados que ficam na mesma comunidade em todas as variantes
  # de sensibilidade da Etapa 3.
  # Só comunidades com núcleo estável de pelo menos este tamanho podem ser polo.
  nucleo_minimo: 20
  # "Quem mais se moveu": compara a posição média nas primeiras e nas últimas N janelas.
  janelas_comparacao: 3

# Etapa 5 — indicadores de governabilidade. Decisões no vault: Método/Registro de decisões.md
governabilidade:
  saida: "data/marts/camara/governabilidade"
  relatorio: "artifacts/reports/governabilidade.md"
  orgaos: [PLEN]
  # Nome da bancada do líder do Governo (mudou de grafia entre legislaturas).
  bancada_governo: ["Governo", "GOV."]
  # Orientações que contam como posição (mesma lógica da codificação A).
  # "Liberado" e vazio ficam fora das medidas de apoio e disciplina.
  valores_orientacao: {"Sim": 1, "Não": -1, "Obstrução": -1}
  # Padronização de nomes de bancada (grafias e nomes cortados -> sigla do partido).
  # Vale para bancadas de partido e para membros de federação ("Fdr A-B-C").
  apelidos_bancada:
    "Novo": "NOVO"
    "Solidaried": "SOLIDARIEDADE"
    "Republican": "REPUBLICANOS"
    "União": "UNIÃO"
    "Avante": "AVANTE"
    "Podemos": "PODE"
    "Missão": "MISSÃO"
    "Patriota": "PATRIOTA"
    "CIDADAN": "CIDADANIA"
  prefixo_federacao: "Fdr "
  # Bancadas que não são partido (não servem para disciplina).
  bancadas_nao_partidarias: ["Governo", "GOV.", "Maioria", "Minoria", "Oposição", "Bloco Parlamentar"]
  # Blocos: terceiro nível (depois de partido e federação). O nome é decifrado pelas
  # abreviações abaixo; só os membros visíveis antes de "..." entram.
  blocos:
    usar: true
    prefixo: "Bl "
    abreviacoes:
      "Uni": "UNIÃO"
      "Pp": "PP"
      "Psd": "PSD"
      "Mdb": "MDB"
      "Rep": "REPUBLICANOS"
      "Pode": "PODE"
      "Psc": "PSC"
      "Avan": "AVANTE"
      "Solid": "SOLIDARIEDADE"
      "Prd": "PRD"
      "Pl": "PL"
      "FdrPsdbCid": ["PSDB", "CIDADANIA"]
      "FdrPt": ["PT", "PCdoB", "PV"]
      "FdrPT": ["PT", "PCdoB", "PV"]
  # Disciplina medida em menos desta fração dos votos do partido aparece com aviso.
  disciplina_cobertura_minima: 0.30
  # Coesão (índice de Rice) só quando o partido tem pelo menos N votos com valor na votação.
  rice_min_votos: 5
  # Votação com proposição destes tipos exige quórum qualificado: placar Sim > Não não basta.
  tipos_quorum_qualificado: [PEC, PLP]
  # Participação: "aproximacao" (em exercício = votou no Plenário no mesmo mês)
  # ou "historico" (períodos de exercício pela API da Câmara).
  participacao_fonte: "historico"

# Armazenamento. Camadas grandes (staging, processed) NÃO ficam no Git: vão como pacotes
# num Release fixo do GitHub, substituídos a cada execução (sem histórico acumulado).
# No Git ficam só código, config, metadados, relatórios e marts (resultados pequenos).
armazenamento:
  repositorio: "cristianojoseblanco/cenarioPoliticoBR"
  release_tag: "dados"
  pacotes:
    staging_camara: "data/staging/camara"
    processed_camara: "data/processed/camara"
    staging_senado: "data/staging/senado"
    processed_senado: "data/processed/senado"
    staging_tse: "data/staging/tse"

# Análises por legislatura (Etapa 7a). Cada uma roda com os MESMOS parâmetros de `redes`,
# `fatias` e `governabilidade`; resultados em data/marts/camara/leg<N>/.
legislaturas:
  "56": {inicio: "2019-02-01", fim: "2023-01-31", nome: "56ª legislatura", governo: "Governo Bolsonaro"}
  "57": {inicio: "2023-02-01", fim: "2027-01-31", nome: "57ª legislatura", governo: "Governo Lula (3º mandato)"}
  # Começa em 2027-02-01; só entra nas análises quando tiver votações suficientes.
  "58": {inicio: "2027-02-01", fim: "2031-01-31", nome: "58ª legislatura", governo: "Governo Lula (4º mandato)"}

# Contexto político usado para nomear períodos e marcar gráficos (fatos institucionais, sem juízo).
contexto:
  governos:
    - {nome: "Governo Jair Bolsonaro", curto: "Bolsonaro", inicio: "2019-01-01", fim: "2022-12-31"}
    - {nome: "Governo Luiz Inácio Lula da Silva (3º mandato)", curto: "Lula 3", inicio: "2023-01-01", fim: "2026-12-31"}
    - {nome: "Governo Luiz Inácio Lula da Silva (4º mandato)", curto: "Lula 4", inicio: "2027-01-01", fim: null}
  presidentes_camara:
    - {nome: "Rodrigo Maia", partido: "DEM-RJ", inicio: "2019-02-01", fim: "2021-02-01"}
    - {nome: "Arthur Lira", partido: "PP-AL", inicio: "2021-02-01", fim: "2025-02-01"}
    - {nome: "Hugo Motta", partido: "Republicanos-PB", inicio: "2025-02-01", fim: null}
  presidentes_senado:
    - {nome: "Davi Alcolumbre", partido: "DEM-AP", inicio: "2019-02-01", fim: "2021-02-01"}
    - {nome: "Rodrigo Pacheco", partido: "PSD-MG", inicio: "2021-02-01", fim: "2025-02-01"}
    - {nome: "Davi Alcolumbre", partido: "União-AP", inicio: "2025-02-01", fim: null}
  eventos:
    - {data: "2022-10-02", rotulo: "Eleições gerais"}
    - {data: "2024-10-06", rotulo: "Eleições municipais"}
    - {data: "2026-10-04", rotulo: "Eleições gerais"}
# Períodos marcados nos gráficos e notas (não excluem dados).
marcadores_periodo:
  - inicio: "2020-03-17"
    fim: "2021-10-21"
    rotulo: "votação remota (aprox.)"
    fonte: "Resolução da Câmara 14/2020; Ato da Mesa 208/2021"

# Dimensões de voto (PCA da matriz deputado × votação, por legislatura).
dimensoes:
  componentes: 3
  # Deputado entra se tem valor em pelo menos esta fração das votações analisadas.
  cobertura_minima: 0.30
  iteracoes_imputacao: 30

# Dinâmica mensal (agenda, polarização, peso de quem está fora dos polos).
dinamica:
  # Votação "apertada": diferença entre os lados abaixo desta fração dos votos com valor.
  margem_apertada: 0.10

# Pontos de mudança e comunidades ao longo do tempo (por legislatura).
mudancas:
  # Mês entra nas séries se teve pelo menos N votações nominais com orientação do Governo.
  min_votacoes_mes: 5
  series: [apoio_polo_a, apoio_polo_b, apoio_fora, polarizacao, vitoria_gov]
  # PELT com custo L2 nas séries padronizadas; penalidade = fator × nº de séries × ln(nº de meses)
  # (fator 1 = critério tipo BIC). Também roda com o fator multiplicado por cada valor de
  # `variantes`: ponto "robusto" = aparece em todas (± tolerancia_meses).
  penalidade_fator: 1.0
  variantes: [0.5, 1.5]
  min_meses: 3
  tolerancia_meses: 1
  # Evento de contexto associado ao ponto se estiver a até N dias.
  janela_contexto_dias: 90

# Rede em várias camadas (voto, frentes parlamentares, coautoria), por legislatura.
multicamadas:
  # Coautoria: só estes tipos, autores deputados proponentes, no máximo N autores por proposição
  # (acima disso é abaixo-assinado, não parceria).
  tipos_coautoria: [PL, PLP, PEC, PDL]
  max_autores: 30
  # Coesão de frente: só frentes com N+ membros com voto; sorteios com a mesma composição partidária.
  min_membros_frente: 10
  sorteios: 200
  semente: 0
  percentil_bloco: 0.95
  # Frentes-chave e os temas oficiais ligados a cada uma (escolha revisável). `padrao` = expressão no título,
  # procurada entre as frentes da legislatura.
  frentes_tematicas:
    - {nome: "Agropecuária (FPA)", padrao: "Agropecuária - FPA", temas: ["Agricultura, Pecuária, Pesca e Extrativismo", "Estrutura Fundiária", "Meio Ambiente e Desenvolvimento Sustentável"]}
    - {nome: "Ambientalista", padrao: "Ambientalista", temas: ["Meio Ambiente e Desenvolvimento Sustentável", "Estrutura Fundiária", "Agricultura, Pecuária, Pesca e Extrativismo"]}
    - {nome: "Agricultura Familiar", padrao: "Mista da Agricultura Familiar", temas: ["Agricultura, Pecuária, Pesca e Extrativismo", "Estrutura Fundiária"]}
    - {nome: "Povos Indígenas", padrao: "Direitos dos Povos Indígenas", temas: ["Direitos Humanos e Minorias", "Estrutura Fundiária", "Meio Ambiente e Desenvolvimento Sustentável"]}
    - {nome: "Evangélica", padrao: "Evangélica do Congresso", temas: ["Direitos Humanos e Minorias", "Arte, Cultura e Religião", "Educação"]}
    - {nome: "Vida e Família", padrao: "Defesa da Vida e da Família", temas: ["Direitos Humanos e Minorias", "Direito Penal e Processual Penal", "Educação"]}
    - {nome: "Segurança Pública", padrao: "^Frente Parlamentar da Segurança Pública$", temas: ["Defesa e Segurança", "Direito Penal e Processual Penal"]}
    - {nome: "Livre Mercado", padrao: "Livre Mercado", temas: ["Economia", "Trabalho e Emprego", "Indústria, Comércio e Serviços", "Finanças Públicas e Orçamento"]}
  # Em cada votação, partido entra com pelo menos N membros e N não membros votando.
  min_por_lado: 3
  reamostragens: 200
  # Efeito do tema só é chamado de claro com intervalos separados E diferença de pelo menos isto.
  efeito_minimo: 0.01
  # Peso de cada camada nas comunidades multicamada (Leiden multiplex).
  pesos_camadas: {voto: 1.0, frentes: 0.5, coautoria: 0.5}

# Modelo de voto individual (por legislatura).
modelo:
  folds: 5                 # validação cruzada por votação
  iteracoes: 300
  taxa_aprendizado: 0.1
  temas: 12                # temas mais frequentes viram variáveis
  # Voto imprevisível: probabilidade prevista para o voto que ocorreu abaixo disto.
  limiar_surpresa: 0.2
  min_votos_deputado: 100  # rankings só com deputados com pelo menos N votos
  amostra_importancia: 20000
  top_votacoes: 15
  top_surpresas: 4000

# Deputados acompanhados (ficha mensal). `id` = identificador da Câmara, quando já existe.
# Sem id, a identificação é pelo nome parlamentar (sem acento/caixa) em deputados da legislatura
# `desde_legislatura` em diante, conferida pela UF dos votos.
acompanhar:
  - {nome: "Lucas Pavanato", uf: "SP", partido_eleito: "PL", desde_legislatura: 58,
     eleicao: "Eleito em 2026 com 3.038.185 votos (mais votado de SP)"}
  - {nome: "Jones Manoel", uf: "PE", partido_eleito: "PSOL", desde_legislatura: 58,
     eleicao: "Eleito em 2026 com cerca de 249 mil votos"}
  - {nome: "Kim Kataguiri", id: 204536, uf: "SP", partido_eleito: "MISSÃO",
     eleicao: "Reeleito em 2026 com 520.025 votos; deputado desde 2019"}

acompanhamento:
  saida: "data/marts/camara/acompanhamento"
  relatorio: "artifacts/reports/acompanhamento.md"
  # "Vota com a bancada" só é medido quando há pelo menos N colegas de partido com voto Sim/Não.
  min_colegas: 3

# Senado Federal (Etapa 7b). Mesmo método da Câmara; os dados são convertidos para o mesmo formato
# processado e as análises rodam com os parâmetros abaixo sobrepostos aos da Câmara (`analise`).
senado:
  api_base: "https://legis.senado.leg.br/dadosabertos"
  anos_padrao: {desde: 2019}
  recarregar_anos_recentes: 1
  pausa_s: 0.5
  caminhos:
    staging: "data/staging/senado"
    processed: "data/processed/senado"
    metadata: "data/metadata/senado"
  # Voto do senador -> mesma grafia da Câmara. Outros registros (AP, P-NRV, LS, MIS, NCom, Presidente…) ficam
  # como vieram e não têm valor na codificação. "Votou" só aparece em votação secreta (excluída).
  mapa_votos: {"Sim": "Sim", "Não": "Não", "SIM": "Sim", "NÃO": "Não", "Abstenção": "Abstenção", "P-OD": "Obstrução"}
  mapa_orientacoes: {"SIM": "Sim", "NÃO": "Não", "LIVRE": "Liberado", "OBSTRUÇÃO": "Obstrução", "ABSTENÇÃO": "Abstenção"}
  apelidos_bancada: {"Republica": "REPUBLICANOS", "Podemos": "PODE", "Cidadania": "CIDADANIA", "PRB": "REPUBLICANOS",
                     "PR": "PL", "PPS": "CIDADANIA", "União": "UNIÃO", "Rede": "REDE", "Novo": "NOVO"}
  # Parâmetros das análises que mudam no Senado (81 senadores e cerca de 90 votações nominais por ano).
  analise:
    redes:
      knn: 8
      min_votos_comuns: 40
    fatias:
      janela_votacoes: 60
      janela_passo: 20
      min_comuns_piso: 20
      nucleo_minimo: 6
    governabilidade:
      bancada_governo: ["Governo"]
      participacao_fonte: "aproximacao"
      blocos: {usar: false}
      bancadas_nao_partidarias: ["Governo", "Oposição", "Maioria", "Minoria", "Banc Fem", "-"]
      rice_min_votos: 3
    mudancas:
      min_votacoes_mes: 3
    modelo:
      min_votos_deputado: 50
      min_votos_votacao: 40

# TSE (Etapa 7c): candidatos, votação por município e receitas de deputado federal e senador.
tse:
  cdn: "https://cdn.tse.jus.br/estatistica/sead/odsele"
  eleicoes: [2018, 2022, 2026]
  # Eleições reprocessadas toda semana (prestação de contas ainda aberta); as outras ficam como estão.
  recarregar: [2026]
  cargos: {senador: 5, deputado_federal: 6}
  # Eleição -> legislatura que ela elegeu (senadores eleitos servem duas legislaturas).
  legislatura_da_eleicao: {2018: "56", 2022: "57", 2026: "58"}
  # Senado: nome de urna × nome parlamentar na mesma UF, semelhança mínima para ligar.
  semelhanca_minima: 0.75
  # Muitas comparações campanha × comportamento: só relações com p abaixo disto entram no relatório e na página.
  alfa: 0.01
  caminhos:
    staging: "data/staging/tse"
    metadata: "data/metadata/tse"

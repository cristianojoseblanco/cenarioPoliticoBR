# Todos os parâmetros de ingestão ficam aqui. Nenhuma constante no código.

camara:
  base_url: "https://dadosabertos.camara.leg.br/arquivos"
  formato: "csv"
  csv_delim: ";"

  # Anos ingeridos por padrão (legislatura 57: 2023–2027).
  # Pode ser sobrescrito pela variável de ambiente ANOS (ex.: "2023,2024").
  anos_padrao: [2023, 2024, 2025, 2026]

  # Arquivos separados por ano: {base_url}/{nome}/{formato}/{nome}-{ano}.{formato}
  datasets_anuais:
    - votacoes
    - votacoesVotos
    - votacoesOrientacoes
    - votacoesProposicoes

  # Arquivos organizados pelo ano de APRESENTAÇÃO da proposição. Os anos são
  # derivados dos dados: todo ano de apresentação de proposição que teve
  # votação nominal nos anos ingeridos (votacoesProposicoes.proposicao_ano),
  # mais os próprios anos ingeridos.
  datasets_por_apresentacao:
    - proposicoes
    - proposicoesTemas
    - proposicoesAutores
  ano_minimo_apresentacao: 1946

  # Arquivos únicos: {base_url}/{nome}/{formato}/{nome}.{formato}
  datasets_unicos:
    - deputados

  # Colunas-chave esperadas, conferidas no relatório de qualidade.
  # Se a Câmara mudar o esquema, o relatório acusa; o código não quebra.
  chaves:
    votacoes: [id]
    votacoesVotos: [idVotacao, deputado_id]
    votacoesOrientacoes: [idVotacao, siglaBancada]
    votacoesProposicoes: [idVotacao, proposicao_id]
    deputados: [uri]

http:
  timeout_s: 300
  retries: 4
  user_agent: "cenarioPoliticoBR/0.1 (pesquisa acadêmica; github.com/cristianojoseblanco/cenarioPoliticoBR)"

caminhos:
  staging: "data/staging/camara"
  metadata: "data/metadata/camara"
  tmp: "data/raw/_tmp"
  relatorio_qualidade: "artifacts/reports/qualidade_camara.md"
  processed: "data/processed/camara"
  relatorio_processed: "artifacts/reports/processed_camara.md"

processamento:
  # Tipos de proposição sem tema próprio herdam o tema da proposição principal
  # (ex.: requerimento de urgência herda o tema do PL a que se refere).
  herdar_tema_da_principal: true
  # Colunas de staging que não passam para a camada processada
  # (dado pessoal sem uso analítico).
  colunas_excluidas:
    deputados: [cpf]

duckdb:
  memory_limit: "4GB"
  threads: 4

# Etapa 3 — rede de votação. Decisões registradas no vault:
# Método/Codificação dos votos.md e Método/Registro de decisões.md
redes:
  saida: "data/marts/camara/redes"
  relatorio: "artifacts/reports/rede_votacao.md"
  orgaos: [PLEN]
  periodo: {inicio: null, fim: null}   # null = tudo o que existe nos dados

  # Valor de cada registro de voto. Registro fora do mapa = sem valor (célula vazia).
  codificacoes:
    A: {"Sim": 1, "Não": -1, "Obstrução": -1}
    B: {"Sim": 1, "Não": -1}
    C: {"Sim": 1, "Não": -1, "Obstrução": -1, "Abstenção": 0}

  # Votação entra se a minoria (entre os votos com valor ±1) for >= este limiar.
  # Votação sem nenhum voto com valor (secreta) sai automaticamente.
  minoria_minima: 0.025

  # Par de deputados só é comparado com pelo menos esse número de votações em comum.
  min_votos_comuns: 50

  # Grafo: cada deputado liga-se aos k mais parecidos (kNN simétrico), peso = concordância.
  knn: 15

  leiden:
    resolucao: 1.0
    sementes: 20        # roda com várias sementes e fica com a de maior qualidade

  # Variações para a análise de sensibilidade (cada uma muda um parâmetro).
  sensibilidade:
    codificacao: [B, C]
    minoria_minima: [0.0, 0.10]
    knn: [10, 25]

  principal:
    codificacao: A
